name: Campfire Kitchen Quality
on:
  push:
    branches: ['main', 'feat/campfire-v3-complete-20260918']
    paths: ['projects/campfire-kitchen/**', '.github/workflows/campfire-kitchen-quality.yml']
  pull_request:
    paths: ['projects/campfire-kitchen/**', '.github/workflows/campfire-kitchen-quality.yml']
permissions:
  contents: read
concurrency:
  group: campfire-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/campfire-kitchen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog and unit tests
        run: |
          npm run validate
          npm test
          python -m pip install -r tests/requirements.txt
          python -m unittest discover -s tests -p '*_test.py'
          python tests/release_checks.py
          python tools/build.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real HTTP browser regression
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser_smoke.py --mode http
      - name: Save exact source, reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-source-${{ github.sha }}
          path: projects/campfire-kitchen/
          include-hidden-files: true
          retention-days: 14
