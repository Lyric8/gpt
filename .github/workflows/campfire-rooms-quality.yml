name: Campfire Rooms Quality
on:
  push:
    branches: ['main', 'feat/campfire-v4.1-rooms-20260918']
    paths: ['projects/campfire-kitchen/**', '.github/workflows/campfire-rooms-quality.yml']
  pull_request:
    paths: ['projects/campfire-kitchen/**', '.github/workflows/campfire-rooms-quality.yml']
permissions:
  contents: read
concurrency:
  group: campfire-rooms-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/campfire-kitchen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Catalog, engine and transactional service tests
        run: |
          npm run validate
          npm test
          python -m unittest discover -s tests -p '*_test.py'
          python tests/release_checks.py
      - name: Verify reproducible HTML
        run: |
          python tools/build.py
          python tools/build.py --output "$RUNNER_TEMP/second.html"
          cmp index.html "$RUNNER_TEMP/second.html"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Existing personal workflow over real HTTP
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser_smoke.py --mode http
      - name: Independent room browsers with native cookies and storage
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/rooms_browser.py
      - name: Preserve source, exact HTML and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-rooms-${{ github.sha }}
          path: |
            projects/campfire-kitchen/
            !projects/campfire-kitchen/**/*.sqlite3*
            !projects/campfire-kitchen/**/*.db*
            !projects/campfire-kitchen/**/__pycache__/**
            !projects/campfire-kitchen/.venv/**
            !projects/campfire-kitchen/.env
          include-hidden-files: true
          retention-days: 14
