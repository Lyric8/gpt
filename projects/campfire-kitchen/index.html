},{"key":"water","ingredient":"water","qty":100,"form":"饮用水","stage":"在家","pack":"饮品","scaling":"linear"},{"key":"cinnamonStick","ingredient":"cinnamonStick","qty":1.5,"form":"小段整棒，量少","stage":"在家","pack":"香料包","scaling":"linear"},{"key":"clove","ingredient":"clove","qty":1,"form":"整粒，煮后取出","stage":"在家","pack":"香料包","scaling":"linear"}],"steps":["果汁与水倒小锅，加肉桂棒和丁香。中小火加热到锅边轻冒小泡，转弱火。","维持热浸约5～8分钟，闻到温暖香气即可；不必煮浓，不加糖或酒。","用勺把丁香与肉桂全部取出，分杯稍凉再喝。小倍率产生不足一整粒丁香时，用香料袋短浸后取出，不掰碎吃。"],"prep":["两种果汁分装冷藏；肉桂和丁香用一只食品用小香料袋装好，便于全部取出。"],"tip":"这份是无酒精果汁热饮；不是热红酒，也不需要点火烧酒。天气热时不必强行选热饮。","equipment":["带盖小锅","耐热杯","勺子"],"activeMinutes":3,"totalMinutes":12,"homeMinutes":2,"sources":["hotApple"],"revision":2,"basePeople":2,"batchFactor":1,"difficulty":"容易","cleanup":"按工具清单备小锅/小碗；每轮去残渣，生熟工具分开，回家正常清洗。","batchNote":"基准2人分享小份。份量变化只改变总量与分批数；单片厚度、成型大小和熟度标准保持不变。做几只按量表与每只规格决定。","policy":"本菜已固定材料形态、配比与加入时机；只调人数/份量，不需要选择鲜干版本。","origin":"作者经典技法的露营改编；用量与分工为本程序设计，尚未在你的炉具上实做验证。","hold":"按卡片顺序现做现吃；易腐食物未上桌前继续冷藏≤4℃。","smoke":"不额外加木烟；让本菜的风味结构先成立。","tags":["肉桂丁香","温热果饮","饭后暖手"],"main":"appleJuice","profile":"肉桂丁香","taste":"果酸甜、温暖香料","texture":"温热果饮","moment":"饭后暖手","fun":"最后把小香料包提起，闻香、捧杯，结束一桌煎烤。","why":"与薄荷气泡饮不是只换水果：温度、气泡和香气完全不同。","decisions":["肉桂与丁香固定干整料，比粉更容易全部取出。","橙汁本版代替橙皮，省一颗只取少量皮的水果；不是精确复制原方。"],"flavors":["肉桂丁香","温热果饮","饭后暖手"],"needsFreezer":false,"freshHerbs":[],"interaction":"轻操作","rich":false,"light":false,"serveClass":"即饮","checkMinutes":5,"allergens":[],"textureFamily":"温热果饮"}],"herbGuide":[{"name":"鲜枝迷迭香","decision":"牛肉与小奶酪用鲜嫩枝；油脂里短浸出香，再整枝取走。","why":"这两道要热油浸香且不留硬针叶。不是说干迷迭香不能做肉，而是本卡已选定动作。","recipes":["rosemary-beef","camembert-dip"],"sources":["rosemary","herbs"]},{"name":"干迷迭香／百里香／牛至","decision":"土豆用切细干迷迭香；口蘑和浓汤用干百里香；希腊鸡与披萨用干牛至。","why":"切细或在湿润油汁中润开；瓶装好存放，份量与时机在各卡固定。","recipes":["rosemary-potato","thyme-mushroom","corn-chowder","greek-chicken","pita-pizza"],"sources":["herbExtension","herbs"]},{"name":"鲜罗勒／鲜薄荷","decision":"番茄面包与草莓气泡饮用鲜罗勒；米纸卷、薄荷糖、酸奶羊肉与气泡饮用鲜薄荷。","why":"这些卡吃的是鲜叶形态与临用香气。没有瓶装模式，不把新鲜感当可关闭选项。","recipes":["basil-toast","basil-berry-soda","summer-roll","mint-pineapple","mint-lamb","virgin-mojito"],"sources":["roll","pineapple","bruschetta"]},{"name":"鲜欧芹／鲜莳萝","decision":"欧芹酸汁以鲜叶为主体、配少量干牛至；莳萝冷酱固定鲜叶。","why":"菜已按冷叶碎的结构定稿。不是要求全库都带，只有选中相应菜才出现在采购单。","recipes":["chimi-beef","dill-salmon"],"sources":["chimi","dill"]},{"name":"粉料与成品酱","decision":"咖喱、孜然、肉桂、甜红椒用瓶装干料；大阪烧酱、咖喱酱、芥末、芝麻酱用成品。","why":"不为“手工”给露营增加十几项制酱工作；经典结构不依赖每样都从零做。","recipes":["satay-chicken","okonomiyaki","mustard-chicken","miso-eggplant","spiced-hot-apple"],"sources":["satay","okonomi","baba","hotApple"]},{"name":"鲜蒜形态也必须固定","decision":"牛肉拍裂浸油、红椒虾切片、扇贝与茄子做蒜蓉、酸汁用极细少量生末。","why":"这不是同一把蒜末到处放：结构、辣感、焦化风险与加入时机不同，清单保留形态。","recipes":["rosemary-beef","paprika-shrimp","scallop-vermicelli","chimi-beef"],"sources":["gambas","scallop","chimi"]}],"principles":["配方已逐道定稿：本程序决定鲜叶、干香料、成品酱与加入时机。你选想吃的菜，不替菜谱做技术选择。","定稿原则是该菜的目标口感与露营操作成本，不声称世界上只有一种最佳食谱。来源支持经典结构和安全，具体份量为露营改编，尚未实灶验证。","材料清单不是采购包装：盐精确需求可能只有0.5g，可按瓶携带；1茶匙=5ml容量，干香料绝不直接当5g。鲜叶与干叶没有自动重量换算。","基准为两人分享小份。想比较两种牛肉可各做半份；别把全部菜当每人一份。小于一整粒/一颗的材料按净重分取，采购另向上取整。","菜单节奏默认一块烤盘逐道做、一个人主厨；时间是估计的占用/主动操作分钟，不是精确炉温模拟，也不许诺能同时独立熏不同木头。","凡写“在家”均是本菜正式流程，不是隐藏劳动。先看家里预制任务，现场只保留值得玩的翻、压、卷、掀盖和装盘。","在家预制与现场步骤共用同一份材料：凡已混成酱/香草油/黄油的，现场直接取该盒，不能按步骤又称一份。家里已蒸熟的也不再从生料重新做。"],"safety":[{"title":"温度比分钟重要","text":"鸡肉74℃；绞牛肉71℃；蛋菜71℃且全凝固；整块/切片牛羊63℃后静置至少3分钟；鱼/扇贝63℃且全不透明。冷藏熟饭、土豆、熟酱等复热74℃。分钟只用于开始检查。","sources":["temp","seafoodFDA"]},{"title":"冷链与生熟分开","text":"冷藏≤4℃；易腐食物离开温控累计不超过2小时，环境高于约32℃不超过1小时。含鲜蒜/香草的油酱当天做、全程冷藏。生腌汁不当熟食酱。","sources":["cold","garlic"]},{"title":"锅盘与炭火","text":"炭炉仅在开放室外使用，并遵守炉具/营地规定，不放普通帐篷或可燃天幕下。保留进排气。酸咸菜用合适锅盘，避免无涂层铝箔接触。","sources":["charcoal","foil"]},{"title":"收尾与木烟","text":"有涂层的盘用合适非金属铲，温热时先去残渣，回家仍需清洗；不泼冷水到滚烫盘。炭完全冷透再按营地规定处理。密封焖菜吸不到有效木烟，不强行给每道菜加烟。","sources":["charcoal"]},{"title":"香料不是无限试错","text":"干料先按量勺分装。鲜蒜香草油酱当天做、全程≤4℃，不是常温油封保存。未知食用性野生叶、观赏植物、精油都不进菜。","sources":["garlic","herbExtension"]}],"presets":[{"id":"play-date","name":"两个人 · 动手但不忙乱","note":"先卷冷米纸，再压牛肉塔可，玉米杯与小芝士杯收尾；口感、温度和动作不重复。","selected function openRecipe(id) { if (!findRecipe(id))
    return; const switched = dialogId !== id; dialogId = id; renderDialog(); if (!dialog.open)

function doToggle(id) { if (!findRecipe(id))

function download(name, contents, type = 'application/json;charset=utf-8') { const blob = new Blob([contents], { type }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000); }

function updateTimer() { const el = document.getElementById('timer-readout'); if (!el)

document.addEventListener('click', event => {
    const b = event.target.closest('[data-action]');
    if (!b)
        return;
    const a = b.dataset.action, id = b.dataset.id;
    event.preventDefault();
    if (a === 'tab')
        switchTab(b.dataset.tab);
    else if (a === 'detail')
        openRecipe(id);
    else if (a === 'close-dialog')
        closeDialog();
    else if (a === 'toggle')
        doToggle(id);
    else if (a === 'category') {
        category = b.dataset.value;
        render();
    }
    else if (a === 'people') {
        state.people = Math.max(1, Math.min(LIMITS.people, state.people + Number(b.dataset.delta)));
        save();
    }
    else if (a === 'preset')
        usePreset(id);
    else if (a === 'inspire') {
        const p = db.presets[presetCycle++ % db.presets.length];
        usePreset(p.id);
    }
    else if (a === 'clear') {
        if (state.selected.length && confirm('清空本次选菜与完成勾选？个人菜谱笔记保留。')) {
            state.selected = [];
            state.order = [];
            state.checked = {};
            state.steps = {};
            save('已清空本次菜单。');
        }
    }
    else if (a === 'sort') {
        state.order = [];
        save();
    }
    else if (a === 'move') {
        const ids = selectedViews(db, state).map(r => r.id), j = ids.indexOf(id), next = j + Number(b.dataset.delta);
        if (j >= 0 && next >= 0 && next < ids.length) {
            [ids[j], ids[next]] = [ids[next], ids[j]];
            state.order = ids;
            save();
        }
    }
    else if (a === 'record') {
        if (!state.selected.length)
            return;
        if (!confirm('记录当前菜单为本次已做过？这不会删除选菜。'))
            return;
        state.history.push({ at: new Date().toISOString(), name: state.menuName, ids: [...state.selected] });
        state.history = state.history.slice(-30);
        save('已记录；下次可筛掉最近三次做过的菜。');
    }
    else if (a === 'export-backup')
        download(`火边完整备份-${dateName()}.json`, JSON.stringify(makeBackup(db, state), null, 2));
    else if (a === 'export-library')
        download('火边定稿菜谱库-v2.json', JSON.stringify(db, null, 2));
    else if (a === 'export-md')
        download(`火边行动单-${dateName()}.md`, makeMarkdown(db, state), 'text/markdown;charset=utf-8');
    else if (a === 'export-csv')
        download(`火边备料-${dateName()}.csv`, makeCSV(db, state), 'text/csv;charset=utf-8');
    else if (a === 'print') {
        const target = document.getElementById('print-container');
        target.innerHTML = `<h1>${E(state.menuName)}</h1><pre>${E(makeMarkdown(db, state))}</pre>`;
        window.print();
    }
    else if (a === 'import-backup')
        document.getElementById('backup-import').click();
    else if (a === 'import-library')
        document.getElementById('library-import').click();
    else if (a === 'restore-library') {
        if (confirm('恢复内置定稿库？自定义库会移除，仍存在的选菜与笔记保留；请先导出自定义库。')) {

    else if (a === 'timer') {
        state.timer = { endsAt: Date.now() + Number(b.dataset.minutes) * 60000, label: findRecipe(id)?.title ?? '检查食物' };
        persist();
        updateTimer();

    else if (a === 'stop-timer') {
        state.timer = null;
        persist();
        updateTimer();
    }

    }
    else if (a === 'dismiss-banner') {
        banner = '';
        render();
    }
});

document.addEventListener('change', event => {

            state.portions[id] = n;

        experience = t.value;

    }

        state.hasFreezer = t.checked;

async function readJSONFile(input) { const file = input.files?.[0]; if (!file)
    return null; if (file.size > LIMITS.fileBytes)
    throw new Error('文件超过5MB上限。'); const value = JSON.parse(await file.text()); return value; }

        return;
